<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Yash Chauhan selected projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset=".6" stop-color="#081827"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".4" stop-color="#10b981"/>
      <stop offset=".72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#f8fafc}
      .m{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:550;fill:#94a3b8}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:760;fill:#e5e7eb}
      .mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:800;fill:#e5e7eb}
      .card{animation:rise 7s ease-in-out infinite}
      @keyframes rise{50%{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="240" fill="#38bdf8" opacity=".07"/>
  <circle cx="120" cy="525" r="230" fill="#10b981" opacity=".06"/>
  <text x="60" y="70" class="h" font-size="36">Selected Projects</text>
  <text x="60" y="106" class="m" font-size="18">Production-style work across fintech, streaming, AI systems, and cloud-native MERN apps.</text>
  <rect x="60" y="130" width="1080" height="4" rx="2" fill="url(#line)"/>

  <g transform="translate(60 166)" filter="url(#shadow)" class="card">
    <rect width="520" height="146" rx="22" fill="#07111f" stroke="#1e3a5f"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#0b2033" stroke="#38bdf8"/>
    <text x="50" y="57" text-anchor="middle" class="mono" font-size="16" fill="#38bdf8">01</text>
    <text x="96" y="47" class="h" font-size="24">MarketPivot</text>
    <text x="96" y="76" class="m" font-size="15">Financial analytics platform</text>
    <text x="24" y="112" class="mono" font-size="13" fill="#38bdf8">React | TypeScript | Node.js | PostgreSQL | i18n</text>
    <text x="24" y="134" class="m" font-size="14">Dashboards, pricing modules, APIs, SEO, and 17-language product experience.</text>
  </g>

  <g transform="translate(620 166)" filter="url(#shadow)" class="card" style="animation-delay:.45s">
    <rect width="520" height="146" rx="22" fill="#07111f" stroke="#1e3a5f"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#0b2a31" stroke="#10b981"/>
    <text x="50" y="57" text-anchor="middle" class="mono" font-size="16" fill="#10b981">02</text>
    <text x="96" y="47" class="h" font-size="24">Watch Wave</text>
    <text x="96" y="76" class="m" font-size="15">OTT streaming platform</text>
    <text x="24" y="112" class="mono" font-size="13" fill="#10b981">React | Node.js | Express | MongoDB | Docker | AWS</text>
    <text x="24" y="134" class="m" font-size="14">Auth, uploads, protected media workflows, streaming modules, and cloud storage.</text>
  </g>

  <g transform="translate(60 344)" filter="url(#shadow)" class="card" style="animation-delay:.9s">
    <rect width="520" height="146" rx="22" fill="#07111f" stroke="#1e3a5f"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#2b2110" stroke="#f59e0b"/>
    <text x="50" y="57" text-anchor="middle" class="mono" font-size="16" fill="#f59e0b">03</text>
    <text x="96" y="47" class="h" font-size="24">RAG AI Agent</text>
    <text x="96" y="76" class="m" font-size="15">Retrieval-augmented generation system</text>
    <text x="24" y="112" class="mono" font-size="13" fill="#f59e0b">LangChain | Pinecone | LLM APIs | React | Node.js</text>
    <text x="24" y="134" class="m" font-size="14">Document ingestion, embeddings, vector search, and grounded AI responses.</text>
  </g>

  <g transform="translate(620 344)" filter="url(#shadow)" class="card" style="animation-delay:1.35s">
    <rect width="520" height="146" rx="22" fill="#07111f" stroke="#1e3a5f"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#321527" stroke="#e11d48"/>
    <text x="50" y="57" text-anchor="middle" class="mono" font-size="16" fill="#fb7185">04</text>
    <text x="96" y="47" class="h" font-size="24">AI Task Platform</text>
    <text x="96" y="76" class="m" font-size="15">DevOps-native MERN application</text>
    <text x="24" y="112" class="mono" font-size="13" fill="#fb7185">MERN | Docker | Kubernetes | ArgoCD | AWS EC2</text>
    <text x="24" y="134" class="m" font-size="14">Containerized app with Kubernetes deployment and GitOps-style delivery flow.</text>
  </g>
</svg>
