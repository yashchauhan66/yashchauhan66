<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Yash Chauhan profile footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03121f"/><stop offset=".55" stop-color="#081827"/><stop offset="1" stop-color="#151225"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".38" stop-color="#10b981"/><stop offset=".72" stop-color="#f59e0b"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#f8fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:550;fill:#94a3b8}.mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:800;fill:#e5e7eb}.dash{stroke:url(#g);stroke-width:3;stroke-linecap:round;stroke-dasharray:9 12;animation:dash 7s linear infinite}@keyframes dash{to{stroke-dashoffset:-180}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="30" fill="url(#bg)"/>
  <circle cx="175" cy="80" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="1010" cy="220" r="230" fill="#e11d48" opacity=".07"/>
  <path d="M160 182 C345 120 485 230 600 170 S860 110 1040 178" class="dash" fill="none" opacity=".75"/>
  <g filter="url(#glow)">
    <circle cx="160" cy="182" r="5" fill="#38bdf8"/><circle cx="600" cy="170" r="5" fill="#10b981"/><circle cx="1040" cy="178" r="5" fill="#f59e0b"/>
  </g>
  <text x="600" y="88" text-anchor="middle" class="h" font-size="38">Let's build something production-worthy.</text>
  <text x="600" y="126" text-anchor="middle" class="m" font-size="18">Open to full stack, backend, fintech, AI product, remote, and contract opportunities.</text>
