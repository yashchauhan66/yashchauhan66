<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Yash Chauhan GitHub Profile Hero">

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="38%" stop-color="#111827"/>
    <stop offset="65%" stop-color="#1E1B4B"/>
    <stop offset="100%" stop-color="#070A13"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="35%" stop-color="#8B5CF6"/>
    <stop offset="70%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#F472B6"/>
  </linearGradient>
  <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;letter-spacing:-1px;fill:#F8FAFC}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:650;fill:#CBD5E1}
    .muted{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:500;fill:#94A3B8}
    .chip{font-family:JetBrains Mono,Consolas,monospace;font-weight:700;fill:#E2E8F0}
    .mono{font-family:JetBrains Mono,Consolas,monospace;fill:#CBD5E1}
    .tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#94A3B8}
    .dash{stroke:url(#brand);stroke-width:3;stroke-linecap:round;stroke-dasharray:8 12;animation:dash 8s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-220}}
  </style>
</defs>

<rect width="1200" height="520" rx="36" fill="url(#bgGrad)"/>
<circle cx="190" cy="80" r="210" fill="url(#orb2)"><animate attributeName="cx" values="160;220;160" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="970" cy="380" r="260" fill="url(#orb1)"><animate attributeName="cy" values="350;410;350" dur="9s" repeatCount="indefinite"/></circle>
<path d="M0 430 C180 360 260 500 430 430 S740 335 910 420 1080 485 1200 410" fill="none" class="dash" opacity="0.8"/>
<path d="M40 90 H390" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
<g filter="url(#soft)">
  <rect x="60" y="115" width="1080" height="292" rx="30" fill="#0B1022" opacity="0.84" stroke="#312E81"/>
  <rect x="82" y="138" width="120" height="34" rx="17" fill="#111827" stroke="#334155"/>
  <circle cx="103" cy="155" r="6" fill="#F87171"/><circle cx="126" cy="155" r="6" fill="#FBBF24"/><circle cx="149" cy="155" r="6" fill="#34D399"/>
  <text x="220" y="161" class="mono" font-size="15">~/github-profile/yashchauhan66</text>
  <text x="94" y="225" class="muted" font-size="18">FULL STACK DEVELOPER · CLOUD · AI ENGINEERING</text>
  <text x="94" y="286" class="title" font-size="72">Yash Chauhan</text>
  <text x="98" y="332" class="sub" font-size="24">I build scalable web systems, AI-native products, and production-ready platforms.</text>
  <g transform="translate(94 358)"><rect width="166" height="40" rx="20" fill="url(#brand)" opacity="0.96"/><text x="22" y="26" class="chip" font-size="14">MERN + TypeScript</text></g>
  <g transform="translate(276 358)"><rect width="148" height="40" rx="20" fill="#111827" stroke="#4C1D95"/><text x="22" y="26" class="chip" font-size="14">Docker · K8s</text></g>
  <g transform="translate(440 358)"><rect width="148" height="40" rx="20" fill="#111827" stroke="#4C1D95"/><text x="22" y="26" class="chip" font-size="14">RAG · LLMs</text></g>
  <g transform="translate(604 358)"><rect width="184" height="40" rx="20" fill="#111827" stroke="#4C1D95"/><text x="22" y="26" class="chip" font-size="14">Fintech Platforms</text></g>
</g>
<g transform="translate(890 148)" filter="url(#glow)">
  <circle cx="78" cy="78" r="74" fill="none" stroke="url(#brand)" stroke-width="6" stroke-dasharray="18 12"><animateTransform attributeName="transform" type="rotate" from="0 78 78" to="360 78 78" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="78" cy="78" r="46" fill="#111827" stroke="#4338CA"/>
  <text x="78" y="71" class="title" text-anchor="middle" font-size="22">YC</text>
  <text x="78" y="96" class="tiny" text-anchor="middle">ship fast</text>
</g>
</svg>
