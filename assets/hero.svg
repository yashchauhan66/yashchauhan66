<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yash Chauhan professional GitHub profile header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset=".55" stop-color="#081827"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".42" stop-color="#10b981"/>
      <stop offset=".72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#f8fafc}
      .lead{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:650;fill:#dbeafe}
      .muted{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:540;fill:#94a3b8}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#e5e7eb}
      .mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:800;fill:#e5e7eb}
      .dash{stroke:url(#accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 14;animation:dash 7s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-220}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="20" r="230" fill="#38bdf8" opacity=".07"/>
  <circle cx="90" cy="350" r="230" fill="#10b981" opacity=".07"/>
  <path d="M64 300 C240 250 390 326 560 276 S835 218 1080 280" fill="none" class="dash" opacity=".45"/>

  <g transform="translate(72 64)">
    <text x="0" y="24" class="mono" font-size="15" fill="#38bdf8">yashchauhan66</text>
    <text x="0" y="92" class="title" font-size="64">Yash Chauhan</text>
    <rect x="2" y="113" width="286" height="5" rx="3" fill="url(#accent)"/>
    <text x="0" y="162" class="lead" font-size="24">Full Stack Developer | MERN Stack | Cloud | AI</text>
    <text x="0" y="202" class="muted" font-size="18">Building scalable web apps, backend APIs, DevOps workflows,</text>
    <text x="0" y="230" class="muted" font-size="18">and AI-powered product features with production discipline.</text>
  </g>

  <g transform="translate(748 58)" filter="url(#shadow)">
    <rect width="372" height="244" rx="24" fill="#07111f" stroke="#1e3a5f"/>
    <rect x="24" y="24" width="324" height="46" rx="16" fill="#0b2033" stroke="#21425f"/>
    <circle cx="48" cy="47" r="6" fill="#38bdf8"/>
    <text x="70" y="53" class="mono" font-size="13">Current focus</text>

    <g transform="translate(24 94)">
      <rect width="150" height="54" rx="16" fill="#081827" stroke="#38bdf8"/>
      <text x="18" y="23" class="mono" font-size="12" fill="#38bdf8">FRONTEND</text>
      <text x="18" y="42" class="label" font-size="15">React + TypeScript</text>
    </g>
    <g transform="translate(198 94)">
      <rect width="150" height="54" rx="16" fill="#081827" stroke="#10b981"/>
      <text x="18" y="23" class="mono" font-size="12" fill="#10b981">BACKEND</text>
      <text x="18" y="42" class="label" font-size="15">Node.js APIs</text>
    </g>
    <g transform="translate(24 166)">
      <rect width="150" height="54" rx="16" fill="#081827" stroke="#f59e0b"/>
      <text x="18" y="23" class="mono" font-size="12" fill="#f59e0b">DEVOPS</text>
      <text x="18" y="42" class="label" font-size="15">Docker + K8s</text>
    </g>
    <g transform="translate(198 166)">
      <rect width="150" height="54" rx="16" fill="#081827" stroke="#e11d48"/>
      <text x="18" y="23" class="mono" font-size="12" fill="#fb7185">AI</text>
      <text x="18" y="42" class="label" font-size="15">RAG + LLMs</text>
    </g>
  </g>
</svg>
