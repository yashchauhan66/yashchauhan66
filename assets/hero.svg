<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Yash Chauhan GitHub profile hero">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03121f"/>
      <stop offset="0.42" stop-color="#081827"/>
      <stop offset="0.72" stop-color="#10172a"/>
      <stop offset="1" stop-color="#160f24"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#f8fafc}
      .lead{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:650;fill:#cbd5e1}
      .muted{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:500;fill:#94a3b8}
      .mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:700;fill:#e5e7eb}
      .line{stroke:#38bdf8;stroke-width:2;stroke-dasharray:9 13;animation:flow 7s linear infinite}
      .float{animation:float 5.5s ease-in-out infinite}
      .float2{animation:float 7s ease-in-out infinite reverse}
      .spin{transform-origin:862px 230px;animation:spin 18s linear infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-220}}
      @keyframes float{50%{transform:translateY(-14px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.45}}
    </style>
  </defs>
  <rect width="1200" height="540" rx="34" fill="url(#sky)"/>
  <circle cx="1010" cy="110" r="260" fill="url(#beam)" class="pulse"/>
  <circle cx="155" cy="435" r="250" fill="#10b981" opacity=".08"/>
  <path d="M0 430 C190 360 290 515 455 420 S720 310 920 395 1090 485 1200 400" fill="none" class="line" opacity=".6"/>
  <path d="M60 420 L600 170 L1140 420 L600 508 Z" fill="#071527" stroke="#14314b"/>
  <path d="M600 170 L1140 420 L600 508 Z" fill="#0b1f33" opacity=".9"/>
  <path d="M60 420 L600 170 L600 508 Z" fill="#081a2b" opacity=".95"/>
  <g opacity=".55">
    <path d="M183 400 H1017" stroke="#1e3a5f"/>
    <path d="M262 365 H938" stroke="#1e3a5f"/>
    <path d="M342 328 H858" stroke="#1e3a5f"/>
    <path d="M420 292 H780" stroke="#1e3a5f"/>
    <path d="M166 421 L600 190 L1034 421" fill="none" stroke="#123553"/>
    <path d="M315 438 L600 226 L885 438" fill="none" stroke="#123553"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="82" width="660" height="302" rx="28" fill="#07111f" stroke="#1f3a54"/>
    <rect x="92" y="106" width="170" height="34" rx="17" fill="#0b1f33" stroke="#21425f"/>
    <circle cx="113" cy="123" r="6" fill="#fb7185"/>
    <circle cx="136" cy="123" r="6" fill="#f59e0b"/>
    <circle cx="159" cy="123" r="6" fill="#10b981"/>
    <text x="286" y="129" class="mono" font-size="14">~/yashchauhan66/profile-os</text>
    <text x="96" y="193" class="muted" font-size="17">FULL STACK DEVELOPER | AI SYSTEMS | CLOUD DELIVERY</text>
    <text x="94" y="262" class="title" font-size="74">Yash Chauhan</text>
    <text x="98" y="306" class="lead" font-size="23">I turn product ideas into scalable web platforms,</text>
    <text x="98" y="337" class="lead" font-size="23">AI workflows, and production-ready systems.</text>
    <g transform="translate(98 354)">
      <rect width="156" height="38" rx="19" fill="url(#aqua)"/>
      <text x="22" y="25" class="mono" font-size="13">MERN + TS</text>
    </g>
    <g transform="translate(270 354)">
      <rect width="142" height="38" rx="19" fill="#0b1f33" stroke="#1e6091"/>
      <text x="20" y="25" class="mono" font-size="13">Docker/K8s</text>
    </g>
    <g transform="translate(428 354)">
      <rect width="124" height="38" rx="19" fill="#0b1f33" stroke="#22795a"/>
      <text x="20" y="25" class="mono" font-size="13">RAG/LLMs</text>
    </g>
    <g transform="translate(568 354)">
      <rect width="134" height="38" rx="19" fill="#0b1f33" stroke="#9a6a16"/>
      <text x="20" y="25" class="mono" font-size="13">Fintech UI</text>
    </g>
  </g>
  <g class="float" filter="url(#shadow)">
    <path d="M814 155 L1014 220 L862 310 L664 235 Z" fill="#0b2138" stroke="#38bdf8"/>
    <path d="M814 155 L1014 220 L1014 283 L862 374 L862 310 Z" fill="#071527" stroke="#1f3a54"/>
    <path d="M664 235 L862 310 L862 374 L664 296 Z" fill="#0a1c2f" stroke="#1f3a54"/>
    <circle cx="862" cy="230" r="76" fill="none" stroke="url(#gold)" stroke-width="5" stroke-dasharray="16 11" class="spin"/>
    <circle cx="862" cy="230" r="48" fill="#07111f" stroke="#2563eb"/>
    <text x="862" y="225" text-anchor="middle" class="title" font-size="24">YC</text>
    <text x="862" y="253" text-anchor="middle" class="muted" font-size="13">ship real</text>
  </g>
  <g class="float2" opacity=".95">
    <rect x="915" y="78" width="150" height="58" rx="16" fill="#06111f" stroke="#10b981"/>
    <text x="938" y="112" class="mono" font-size="14">API: stable</text>
    <rect x="805" y="392" width="190" height="58" rx="16" fill="#06111f" stroke="#f59e0b"/>
    <text x="828" y="426" class="mono" font-size="14">deploy: green</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="742" cy="118" r="5" fill="#38bdf8"/>
    <circle cx="1058" cy="346" r="5" fill="#10b981"/>
    <circle cx="520" cy="452" r="4" fill="#f59e0b"/>
  </g>
</svg>
