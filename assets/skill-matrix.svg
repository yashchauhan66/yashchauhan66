  <rect x="230" y="19" width="110" height="38" rx="19" fill="#111827" stroke="#312E81"/>
  <text x="250" y="43" class="sub" font-size="15">Node.js</text>
  <rect x="356" y="19" width="138" height="38" rx="19" fill="#111827" stroke="#312E81"/>
