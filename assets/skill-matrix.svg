<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Yash Chauhan technical skill matrix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03121f"/><stop offset=".55" stop-color="#081827"/><stop offset="1" stop-color="#151225"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".45" stop-color="#10b981"/><stop offset=".75" stop-color="#f59e0b"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#000" flood-opacity=".38"/></filter>
    <style>
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#f8fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:550;fill:#94a3b8}.t{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:760;fill:#e5e7eb}.mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:800;fill:#e5e7eb}.scan{animation:scan 5.5s ease-in-out infinite}.row{animation:rise 7s ease-in-out infinite}@keyframes scan{50%{transform:translateX(780px)}}@keyframes rise{50%{transform:translateY(-5px)}}
    </style>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="275" fill="#38bdf8" opacity=".08"/>
  <circle cx="165" cy="560" r="260" fill="#e11d48" opacity=".07"/>
  <text x="60" y="72" class="h" font-size="36">Technical Arsenal</text>
  <text x="60" y="108" class="m" font-size="18">A production stack across interface, API, data, cloud, and AI layers.</text>
  <rect x="60" y="132" width="1080" height="4" rx="2" fill="#14314b"/>
  <rect x="60" y="132" width="260" height="4" rx="2" fill="url(#bar)" class="scan"/>
  <g transform="translate(60 165)" filter="url(#s)" class="row">
    <path d="M0 18 L42 0 H1080 L1038 76 H0 Z" fill="#071527" stroke="#1e3a5f"/>
    <text x="28" y="49" class="mono" font-size="18" fill="#38bdf8">Frontend</text>
    <text x="240" y="49" class="t" font-size="16">React.js</text><text x="370" y="49" class="t" font-size="16">Next.js</text><text x="500" y="49" class="t" font-size="16">TypeScript</text><text x="660" y="49" class="t" font-size="16">Tailwind CSS</text><text x="850" y="49" class="t" font-size="16">Redux Toolkit</text>
  </g>
  <g transform="translate(60 253)" filter="url(#s)" class="row" style="animation-delay:.45s">
    <path d="M0 18 L42 0 H1080 L1038 76 H0 Z" fill="#071527" stroke="#1e3a5f"/>
    <text x="28" y="49" class="mono" font-size="18" fill="#10b981">Backend</text>
    <text x="240" y="49" class="t" font-size="16">Node.js</text><text x="370" y="49" class="t" font-size="16">Express.js</text><text x="520" y="49" class="t" font-size="16">REST APIs</text><text x="680" y="49" class="t" font-size="16">JWT Auth</text><text x="835" y="49" class="t" font-size="16">Microservices</text>
  </g>
  <g transform="translate(60 341)" filter="url(#s)" class="row" style="animation-delay:.9s">
    <path d="M0 18 L42 0 H1080 L1038 76 H0 Z" fill="#071527" stroke="#1e3a5f"/>
    <text x="28" y="49" class="mono" font-size="18" fill="#f59e0b">Data Layer</text>
    <text x="240" y="49" class="t" font-size="16">MongoDB</text><text x="380" y="49" class="t" font-size="16">PostgreSQL</text><text x="555" y="49" class="t" font-size="16">Redis</text><text x="675" y="49" class="t" font-size="16">Pinecone</text><text x="820" y="49" class="t" font-size="16">Knex.js</text>
  </g>
  <g transform="translate(60 429)" filter="url(#s)" class="row" style="animation-delay:1.35s">
    <path d="M0 18 L42 0 H1080 L1038 76 H0 Z" fill="#071527" stroke="#1e3a5f"/>
    <text x="28" y="49" class="mono" font-size="18" fill="#38bdf8">Cloud/DevOps</text>
    <text x="240" y="49" class="t" font-size="16">Docker</text><text x="370" y="49" class="t" font-size="16">Kubernetes</text><text x="545" y="49" class="t" font-size="16">AWS EC2/S3</text><text x="725" y="49" class="t" font-size="16">GitHub Actions</text><text x="930" y="49" class="t" font-size="16">ArgoCD</text>
  </g>
  <g transform="translate(60 517)" filter="url(#s)" class="row" style="animation-delay:1.8s">
    <path d="M0 18 L42 0 H1080 L1038 76 H0 Z" fill="#071527" stroke="#1e3a5f"/>
    <text x="28" y="49" class="mono" font-size="18" fill="#e11d48">AI Engineering</text>
    <text x="240" y="49" class="t" font-size="16">LangChain</text><text x="395" y="49" class="t" font-size="16">RAG Systems</text><text x="575" y="49" class="t" font-size="16">LLM APIs</text><text x="730" y="49" class="t" font-size="16">Vector Search</text><text x="930" y="49" class="t" font-size="16">N8N</text>
  </g>
</svg>
