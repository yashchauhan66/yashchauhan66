</g>
<g transform="translate(60 414)" filter="url(#soft)">
  <rect width="1080" height="76" rx="20" fill="#0F172A" stroke="#1E293B"/>
  <text x="26" y="47" class="chip" font-size="19" fill="#A855F7">Cloud / DevOps</text>
  <rect x="230" y="19" width="110" height="38" rx="19" fill="#111827" stroke="#312E81"/>
