<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yash Chauhan delivery pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03121f"/><stop offset=".6" stop-color="#081827"/><stop offset="1" stop-color="#151225"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".38" stop-color="#10b981"/><stop offset=".72" stop-color="#f59e0b"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;fill:#f8fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:550;fill:#94a3b8}.t{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:760;fill:#e5e7eb}.mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:800;fill:#e5e7eb}.dash{stroke:url(#g);stroke-width:4;stroke-linecap:round;stroke-dasharray:10 14;animation:dash 6.5s linear infinite}.node{animation:bob 5.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-220}}@keyframes bob{50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <circle cx="120" cy="300" r="230" fill="#38bdf8" opacity=".08"/>
  <circle cx="1050" cy="70" r="240" fill="#e11d48" opacity=".07"/>
  <text x="60" y="70" class="h" font-size="36">Delivery Pipeline</text>
  <text x="60" y="106" class="m" font-size="18">How I move from rough idea to shipped product without losing quality.</text>
  <path d="M145 205 H1065" class="dash" opacity=".78"/>
  <g transform="translate(100 150)" filter="url(#s)" class="node">
    <path d="M45 0 L90 28 V82 L45 110 L0 82 V28 Z" fill="#071527" stroke="#38bdf8" stroke-width="3"/>
    <text x="45" y="46" text-anchor="middle" class="h" font-size="20">01</text><text x="45" y="72" text-anchor="middle" class="m" font-size="13">Plan</text>
    <text x="45" y="140" text-anchor="middle" class="t" font-size="17">Plan</text><text x="45" y="164" text-anchor="middle" class="m" font-size="13">scope + architecture</text>
  </g>
  <g transform="translate(330 150)" filter="url(#s)" class="node" style="animation-delay:.45s">
    <path d="M45 0 L90 28 V82 L45 110 L0 82 V28 Z" fill="#071527" stroke="#10b981" stroke-width="3"/>
    <text x="45" y="46" text-anchor="middle" class="h" font-size="20">02</text><text x="45" y="72" text-anchor="middle" class="m" font-size="13">Build</text>
    <text x="45" y="140" text-anchor="middle" class="t" font-size="17">Build</text><text x="45" y="164" text-anchor="middle" class="m" font-size="13">components + APIs</text>
  </g>
  <g transform="translate(560 150)" filter="url(#s)" class="node" style="animation-delay:.9s">
    <path d="M45 0 L90 28 V82 L45 110 L0 82 V28 Z" fill="#071527" stroke="#f59e0b" stroke-width="3"/>
    <text x="45" y="46" text-anchor="middle" class="h" font-size="20">03</text><text x="45" y="72" text-anchor="middle" class="m" font-size="13">Secure</text>
    <text x="45" y="140" text-anchor="middle" class="t" font-size="17">Secure</text><text x="45" y="164" text-anchor="middle" class="m" font-size="13">auth + validation</text>
  </g>
  <g transform="translate(790 150)" filter="url(#s)" class="node" style="animation-delay:1.35s">
    <path d="M45 0 L90 28 V82 L45 110 L0 82 V28 Z" fill="#071527" stroke="#38bdf8" stroke-width="3"/>
    <text x="45" y="46" text-anchor="middle" class="h" font-size="20">04</text><text x="45" y="72" text-anchor="middle" class="m" font-size="13">Deploy</text>
    <text x="45" y="140" text-anchor="middle" class="t" font-size="17">Deploy</text><text x="45" y="164" text-anchor="middle" class="m" font-size="13">Docker + CI/CD</text>
  </g>
  <g transform="translate(1020 150)" filter="url(#s)" class="node" style="animation-delay:1.8s">
    <path d="M45 0 L90 28 V82 L45 110 L0 82 V28 Z" fill="#071527" stroke="#e11d48" stroke-width="3"/>
    <text x="45" y="46" text-anchor="middle" class="h" font-size="20">05</text><text x="45" y="72" text-anchor="middle" class="m" font-size="13">Improve</text>
    <text x="45" y="140" text-anchor="middle" class="t" font-size="17">Improve</text><text x="45" y="164" text-anchor="middle" class="m" font-size="13">logs + feedback</text>
  </g>
</svg>
