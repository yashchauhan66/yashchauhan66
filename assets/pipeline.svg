<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yash Chauhan Delivery Pipeline">

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="38%" stop-color="#111827"/>
    <stop offset="65%" stop-color="#1E1B4B"/>
    <stop offset="100%" stop-color="#070A13"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="35%" stop-color="#8B5CF6"/>
    <stop offset="70%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#F472B6"/>
  </linearGradient>
  <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;letter-spacing:-1px;fill:#F8FAFC}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:650;fill:#CBD5E1}
    .muted{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:500;fill:#94A3B8}
    .chip{font-family:JetBrains Mono,Consolas,monospace;font-weight:700;fill:#E2E8F0}
    .mono{font-family:JetBrains Mono,Consolas,monospace;fill:#CBD5E1}
    .tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#94A3B8}
    .dash{stroke:url(#brand);stroke-width:3;stroke-linecap:round;stroke-dasharray:8 12;animation:dash 8s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-220}}
  </style>
</defs>

<rect width="1200" height="360" rx="32" fill="#070A13"/>
<circle cx="100" cy="300" r="230" fill="url(#orb2)"/>
<circle cx="1050" cy="70" r="250" fill="url(#orb1)"/>
<text x="60" y="70" class="title" font-size="36">Delivery Pipeline</text>
<text x="60" y="104" class="muted" font-size="18">How I move from idea to production without losing quality.</text>
<path d="M135 210 H1065" class="dash" opacity="0.8"/>
<g transform="translate(100 155)" filter="url(#soft)">
  <circle cx="45" cy="55" r="44" fill="#0F172A" stroke="url(#brand)" stroke-width="3"/>
  <text x="45" y="50" class="title" font-size="20" text-anchor="middle">01</text>
  <text x="45" y="78" class="muted" font-size="13" text-anchor="middle">Plan</text>
  <text x="45" y="130" class="sub" font-size="17" text-anchor="middle">Plan</text>
  <text x="45" y="154" class="muted" font-size="13" text-anchor="middle">requirements</text>
  <text x="45" y="174" class="muted" font-size="13" text-anchor="middle">architecture</text>
</g>
<g transform="translate(330 155)" filter="url(#soft)">
  <circle cx="45" cy="55" r="44" fill="#0F172A" stroke="url(#brand)" stroke-width="3"/>
  <text x="45" y="50" class="title" font-size="20" text-anchor="middle">02</text>
  <text x="45" y="78" class="muted" font-size="13" text-anchor="middle">Build</text>
  <text x="45" y="130" class="sub" font-size="17" text-anchor="middle">Build</text>
  <text x="45" y="154" class="muted" font-size="13" text-anchor="middle">clean code</text>
  <text x="45" y="174" class="muted" font-size="13" text-anchor="middle">components</text>
</g>
<g transform="translate(560 155)" filter="url(#soft)">
  <circle cx="45" cy="55" r="44" fill="#0F172A" stroke="url(#brand)" stroke-width="3"/>
  <text x="45" y="50" class="title" font-size="20" text-anchor="middle">03</text>
  <text x="45" y="78" class="muted" font-size="13" text-anchor="middle">Secure</text>
  <text x="45" y="130" class="sub" font-size="17" text-anchor="middle">Secure</text>
  <text x="45" y="154" class="muted" font-size="13" text-anchor="middle">auth</text>
  <text x="45" y="174" class="muted" font-size="13" text-anchor="middle">validation</text>
</g>
<g transform="translate(790 155)" filter="url(#soft)">
  <circle cx="45" cy="55" r="44" fill="#0F172A" stroke="url(#brand)" stroke-width="3"/>
  <text x="45" y="50" class="title" font-size="20" text-anchor="middle">04</text>
  <text x="45" y="78" class="muted" font-size="13" text-anchor="middle">Deploy</text>
  <text x="45" y="130" class="sub" font-size="17" text-anchor="middle">Deploy</text>
  <text x="45" y="154" class="muted" font-size="13" text-anchor="middle">Docker</text>
  <text x="45" y="174" class="muted" font-size="13" text-anchor="middle">CI/CD</text>
</g>
<g transform="translate(1020 155)" filter="url(#soft)">
  <circle cx="45" cy="55" r="44" fill="#0F172A" stroke="url(#brand)" stroke-width="3"/>
  <text x="45" y="50" class="title" font-size="20" text-anchor="middle">05</text>
  <text x="45" y="78" class="muted" font-size="13" text-anchor="middle">Observe</text>
  <text x="45" y="130" class="sub" font-size="17" text-anchor="middle">Observe</text>
  <text x="45" y="154" class="muted" font-size="13" text-anchor="middle">logs</text>
  <text x="45" y="174" class="muted" font-size="13" text-anchor="middle">metrics</text>
</g>
</svg>
